server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    # 本地默认 root/root；云端部署通过环境变量 DB_URL / DB_USER / DB_PASS 覆盖（如 TiDB Cloud）
    url: ${DB_URL:jdbc:mysql://localhost:3306/donkey_trace?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

jwt:
  secret: donkey-trace-baoding-2026-secret-key-0123456789abcdef
  expire-hours: 12

logging:
  level:
    root: info
